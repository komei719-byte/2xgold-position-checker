name: Daily Position Check

on:
  schedule:
    # 毎日 日本時間 午前8時 (UTC 23:00) に自動実行
    - cron: '0 23 * * *'
  workflow_dispatch: # 手動実行ボタンも有効化

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python check_position.py

      - name: Commit & Push index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto update position ratio" || exit 0
          git push
